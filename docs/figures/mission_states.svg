<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#087f8c"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#b46913"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial,sans-serif" fill="#14263e"><text x="65" y="70" font-size="44" font-weight="bold">Mission phases and shutdown</text><rect x="90" y="205" width="400" height="130" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="290" y="263.5" text-anchor="middle" font-size="25">LAUNCH</text><text x="290" y="294.5" text-anchor="middle" font-size="25">0 to 20,000 ticks</text><rect x="590" y="205" width="400" height="130" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="790" y="263.5" text-anchor="middle" font-size="25">ASCENT</text><text x="790" y="294.5" text-anchor="middle" font-size="25">20,000 to 40,000</text><rect x="1090" y="205" width="400" height="130" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="1290" y="263.5" text-anchor="middle" font-size="25">ORBIT INSERTION</text><text x="1290" y="294.5" text-anchor="middle" font-size="25">40,000 to 60,000</text><path d="M490 270 H590" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><path d="M990 270 H1090" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><text x="95" y="390" font-size="25">Telemetry / command period</text><text x="120" y="440" font-size="31">50 / 160 ms</text><text x="645" y="440" font-size="31">100 / 60 ms</text><text x="1140" y="440" font-size="31">40 / 100 ms</text><text x="95" y="520" font-size="25">Dynamic worker priority T / C</text><text x="200" y="570" font-size="34">3 / 2</text><text x="700" y="570" font-size="34">2 / 3</text><text x="1200" y="570" font-size="34">3 / 2</text><rect x="590" y="660" width="900" height="100" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="1040" y="719" text-anchor="middle" font-size="25">Mission end: request stop, drain, flush, COUNTS, host exit</text><path d="M1290 335 V660" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><text x="90" y="825" font-size="24">Nominal 60-second schedule. Phase manager polls every 10 ticks. Shutdown adds time.</text></g></svg>