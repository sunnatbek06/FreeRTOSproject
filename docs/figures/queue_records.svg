<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#087f8c"/></marker><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#b46913"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial,sans-serif" fill="#14263e"><text x="65" y="70" font-size="44" font-weight="bold">Queue ownership and record structures</text><rect x="80" y="180" width="400" height="185" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="280" y="235" text-anchor="middle" font-size="25">Message</text><text x="280" y="266" text-anchor="middle" font-size="25">created: TickType_t</text><text x="280" y="297" text-anchor="middle" font-size="25">id: unsigned</text><text x="280" y="328" text-anchor="middle" font-size="25">phase: Phase</text><rect x="600" y="180" width="400" height="185" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="800" y="235" text-anchor="middle" font-size="25">Input queues</text><text x="800" y="266" text-anchor="middle" font-size="25">Telemetry: 1–256 (default 16)</text><text x="800" y="297" text-anchor="middle" font-size="25">Command: 16</text><text x="800" y="328" text-anchor="middle" font-size="25">Emergency: 8</text><rect x="1120" y="180" width="400" height="185" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="1320" y="250.5" text-anchor="middle" font-size="25">Worker owns local copy</text><text x="1320" y="281.5" text-anchor="middle" font-size="25">Receive with 20 ms timeout</text><text x="1320" y="312.5" text-anchor="middle" font-size="25">Process + count + log</text><path d="M480 272 H600" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><path d="M1000 272 H1120" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><rect x="80" y="480" width="560" height="230" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="360" y="557.5" text-anchor="middle" font-size="25">Event</text><text x="360" y="588.5" text-anchor="middle" font-size="25">tick, phase, channel, event</text><text x="360" y="619.5" text-anchor="middle" font-size="25">depth, latency, deadline</text><text x="360" y="650.5" text-anchor="middle" font-size="25">String pointers refer to program literals</text><rect x="760" y="480" width="330" height="230" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="925" y="557.5" text-anchor="middle" font-size="25">Event queue</text><text x="925" y="588.5" text-anchor="middle" font-size="25">1024 Event values</text><text x="925" y="619.5" text-anchor="middle" font-size="25">Zero-wait send</text><text x="925" y="650.5" text-anchor="middle" font-size="25">Lost events counted</text><rect x="1210" y="480" width="310" height="230" rx="9" fill="#f0f6f8" stroke="#14263e" stroke-width="2"/><text x="1365" y="573" text-anchor="middle" font-size="25">Logger</text><text x="1365" y="604" text-anchor="middle" font-size="25">8 CSV fields</text><text x="1365" y="635" text-anchor="middle" font-size="25">Single stdout writer</text><path d="M640 595 H760" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><path d="M1090 595 H1210" fill="none" stroke="#087f8c" stroke-width="4"  marker-end="url(#a)"/><text x="80" y="815" font-size="26">Queue operations copy structures by value. ABI layout is not a radio packet format.</text></g></svg>